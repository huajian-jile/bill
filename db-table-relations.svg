<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" lang="zh-CN">
  <defs>
    <style>
      .title { font: 700 18px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #111827; }
      .subtitle { font: 12px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #6b7280; }
      .boxTitle { font: 700 13px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #111827; }
      .boxText { font: 12px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #374151; }
      .groupLabel { font: 700 12px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #111827; }
      .group { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 2; }
      .tbl { fill: #ffffff; stroke: #c7d2fe; stroke-width: 2; rx: 10; ry: 10; }
      .tbl2 { fill: #ffffff; stroke: #bbf7d0; stroke-width: 2; rx: 10; ry: 10; }
      .tbl3 { fill: #ffffff; stroke: #fecaca; stroke-width: 2; rx: 10; ry: 10; }
      .link { stroke: #6b7280; stroke-width: 2; fill: none; }
      .linkBold { stroke: #111827; stroke-width: 2.5; fill: none; }
      .linkNote { font: 11px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #374151; }
      .pill { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1; rx: 10; ry: 10; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowBold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#111827"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="30" y="35" class="title">账单与用户关系图</text>
  <text x="30" y="58" class="subtitle">RBAC / 手机号绑定 / 交易记录</text>

  <!-- Groups -->
  <rect x="25" y="85" width="410" height="330" class="group"/>
  <text x="40" y="110" class="groupLabel">RBAC 权限模型</text>

  <rect x="25" y="430" width="410" height="360" class="group"/>
  <text x="40" y="455" class="groupLabel">绑定与审核</text>

  <rect x="455" y="85" width="430" height="330" class="group"/>
  <text x="470" y="110" class="groupLabel">人员与微信</text>

  <rect x="905" y="85" width="470" height="705" class="group"/>
  <text x="920" y="110" class="groupLabel">账单与备份</text>

  <!-- RBAC tables -->
  <rect x="50" y="130" width="170" height="70" class="tbl"/>
  <text x="65" y="155" class="boxTitle">app_users</text>
  <text x="65" y="175" class="boxText">用户表</text>

  <rect x="255" y="130" width="150" height="70" class="tbl"/>
  <text x="270" y="155" class="boxTitle">roles</text>
  <text x="270" y="175" class="boxText">角色</text>

  <rect x="255" y="225" width="150" height="70" class="tbl"/>
  <text x="270" y="250" class="boxTitle">permissions</text>
  <text x="270" y="270" class="boxText">权限</text>

  <rect x="50" y="225" width="170" height="70" class="tbl"/>
  <text x="65" y="250" class="boxTitle">user_roles</text>
  <text x="65" y="270" class="boxText">用户-角色关联</text>

  <rect x="50" y="320" width="170" height="70" class="tbl"/>
  <text x="65" y="345" class="boxTitle">role_permissions</text>
  <text x="65" y="365" class="boxText">角色-权限关联</text>

  <!-- Bind/Audit tables -->
  <rect x="50" y="480" width="170" height="70" class="tbl2"/>
  <text x="65" y="505" class="boxTitle">app_user_phones</text>
  <text x="65" y="525" class="boxText">用户手机绑定</text>

  <rect x="50" y="580" width="170" height="90" class="tbl3"/>
  <text x="65" y="605" class="boxTitle">phone_bind_request</text>
  <text x="65" y="625" class="boxText">绑定请求记录</text>
  <text x="65" y="645" class="boxText">拒绝原因</text>

  <rect x="255" y="505" width="150" height="70" class="tbl"/>
  <text x="270" y="530" class="boxTitle">phone_number</text>
  <text x="270" y="550" class="boxText">手机号码</text>

  <!-- Person tables -->
  <rect x="485" y="150" width="170" height="70" class="tbl"/>
  <text x="500" y="175" class="boxTitle">phone_number</text>
  <text x="500" y="195" class="boxText">手机号码</text>

  <rect x="690" y="150" width="170" height="70" class="tbl"/>
  <text x="705" y="175" class="boxTitle">person</text>
  <text x="705" y="195" class="boxText">人员档案</text>

  <rect x="485" y="250" width="170" height="70" class="tbl"/>
  <text x="500" y="275" class="boxTitle">person_phone</text>
  <text x="500" y="295" class="boxText">人员-手机关联</text>

  <rect x="690" y="250" width="170" height="70" class="tbl"/>
  <text x="705" y="275" class="boxTitle">wechat_users</text>
  <text x="705" y="295" class="boxText">微信用户</text>

  <!-- Import/Tx/Bkp tables -->
  <rect x="930" y="150" width="200" height="70" class="tbl"/>
  <text x="945" y="175" class="boxTitle">wechat_bill_imports</text>
  <text x="945" y="195" class="boxText">账单导入记录</text>

  <rect x="930" y="250" width="200" height="70" class="tbl"/>
  <text x="945" y="275" class="boxTitle">wechat_bill_transactions</text>
  <text x="945" y="295" class="boxText">账单交易明细</text>

  <rect x="930" y="365" width="200" height="70" class="tbl"/>
  <text x="945" y="390" class="boxTitle">bkp_wechat_bill_transactions</text>
  <text x="945" y="410" class="boxText">账单备份表</text>

  <rect x="1180" y="150" width="170" height="70" class="tbl"/>
  <text x="1195" y="175" class="boxTitle">wx_phone_session</text>
  <text x="1195" y="195" class="boxText">微信手机会话</text>

  <!-- Legend -->
  <rect x="930" y="470" width="420" height="300" class="pill"/>
  <text x="950" y="495" class="boxTitle">图例说明</text>
  <text x="950" y="520" class="boxText">- 核心业务流程梳理</text>
  <text x="950" y="542" class="boxText">- 手机号相关逻辑处理</text>
  <text x="950" y="564" class="boxText">- 权限与绑定关系映射</text>
  <text x="950" y="586" class="boxText">- 数据流向与备份策略</text>
</svg>